name: insecta_id
description: "A new Flutter project"
publish_to: none

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  intl: ^0.19.0
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  image: ^4.2.0
  tflite_flutter: ^0.11.0
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/model/
    - assets/images/ # Klasörü bu şekilde tanımlarsan içindeki tüm png'ler yüklenir
    - assets/images/ablem.png
    - assets/images/icon.png

flutter_launcher_icons:
  android: true
  image_path: "assets/images/ablem.png"
